# Prometheus scrape config for the Radiant reference stack.
#
# Scrapes the collector's Prometheus exporter (metrics pushed via OTLP). To scrape a Radiant
# host's in-process endpoint directly instead of going through the collector, add a job pointing
# at the host's PrometheusScrapeSettings port (default 9464) — shown commented below.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Direct in-process scrape of a Radiant host (no collector in the path). The endpoint binds
  # PrometheusScrapeSettings.Hostname (default localhost, which is unreachable from this container)
  # and answers only requests addressed to that name. Wildcards (*, +, 0.0.0.0) are not supported.
  # Run the app on this compose network, set its Hostname to its compose service name, and use that
  # name here:
  # - job_name: radiant-app
  #   static_configs:
  #     - targets: ["my-service:9464"]
